[package]
name = "sealproxy"
version = "0.1.0"
edition = "2018"

[dependencies]
hyper = { version = "0.14", features = ["server", "http1", "http2", "runtime", "tcp", "stream", "client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.33"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
url = { version = "2", features = ["serde"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1.22", features = ["v4"] }
async-trait = "0.1"
arc-swap = "1.3"
once_cell = "1.8"
base64 = "0.21"
cookie = "0.18.1"
jsonwebtoken = "8"
time = "0.3"
route-recognizer = "0.3.1"
serde_urlencoded = "0.7.1"
clap = "4"
tls-listener = { version = "0.2.1", features = ["hyper-h1", "hyper-h2"] }
rustls = "0.19.1"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.4"
dotenv = "0.15.0"
futures-util = "0.3"
colored = "2.2"
chrono = "0.4.44"
inotify = { version = "0.11.1", features = ["stream"] }
mime = "0.3.17"
ldap3 = "0.10.6"
